async function save(){
 localStorage.setItem('pugliaTripState',JSON.stringify(state));
 if(!isAuthorizedOrganizer()){
   setSyncStatus('Organizer is not signed in. Changes are only on this device.','error');
   return {shared:false,reason:'not-authorized'};
 }
 setSyncStatus('Saving changes online…');
 const payload=JSON.stringify(state);
 try{
   await tripDoc.set({payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
   const verified=await tripDoc.get({source:'server'});
   const remote=verified.data()||{};
   if(remote.payload!==payload)throw new Error('Server verification did not match the saved trip data.');
   remoteDocExists=true; firebaseReady=true; lastSyncTime=Date.now();
   setSyncStatus('Shared trip is up to date · '+formatSyncTime(),'ok');
   return {shared:true};
 }catch(err){
   console.error('Firestore save/verify failed',err);
   syncError=err.message||String(err);
   setSyncStatus('Online save failed. Changes are only on this device.','error');
   alert('The online save failed, so travellers did not receive this change.');
   return {shared:false,error:err};
 }
}

function itineraryDate(d){
 const m=(d[0]||'').match(/([A-Za-z]+)\s+(\d{1,2})/); if(!m)return null;
 const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sept:8,Sep:8,Oct:9,Nov:10,Dec:11};
 const key=m[1].slice(0,4); const month=months[key]??months[m[1].slice(0,3)];
 return month===undefined?null:new Date((state.meta&&+state.meta.year)||2026,month,+m[2]);
}
function homeDayForToday(){
 const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const dated=state.itinerary.map((d,i)=>({d,i,date:itineraryDate(d)})).filter(x=>x.date).sort((a,b)=>a.date-b.date);
 if(!dated.length)return {d:state.itinerary[0],label:'Next up'};
 const first=dated[0],last=dated[dated.length-1];
 const exact=dated.find(x=>x.date.getTime()===today.getTime());
 if(exact)return {d:exact.d,i:exact.i,date:exact.date,label:`Today · ${exact.d[0]}`,today:true};
 if(today<first.date)return {d:first.d,i:first.i,date:first.date,label:`Next up · ${first.d[0]}`,beforeTrip:true};
 if(today>last.date)return {d:last.d,i:last.i,date:last.date,label:'Trip complete',complete:true};
 const next=dated.find(x=>x.date>today);
 return next?{d:next.d,i:next.i,date:next.date,label:`Next up · ${next.d[0]}`}:{d:last.d,i:last.i,date:last.date,label:'Trip complete',complete:true};
}
function secondaryHomeDay(pick){
 if(pick.complete)return null;
 const dated=state.itinerary.map((d,i)=>({d,i,date:itineraryDate(d)})).filter(x=>x.date).sort((a,b)=>a.date-b.date);
 if(pick.today){
   const tomorrow=new Date(pick.date); tomorrow.setDate(tomorrow.getDate()+1);
   const exactTomorrow=dated.find(x=>x.date.getTime()===tomorrow.getTime());
   return exactTomorrow?{...exactTomorrow,label:`Tomorrow · ${exactTomorrow.d[0]}`}:null;
 }
 if(pick.beforeTrip){
   const following=dated.find(x=>x.date>pick.date);
   return following?{...following,label:`Following day · ${following.d[0]}`}:null;
 }
 return null;
}

function installCard(){
  if(isStandalone()) return '';
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(deferredInstallPrompt) return `<div class="card install-card"><div class="label">Install app</div><div class="big">Add Puglia 2026 to your phone</div><div class="muted">Install it for a full-screen app experience and quicker access.</div><button class="btn" id="installAppBtn">Install Puglia 2026</button></div>`;

  return '';
}

   state.hotels.map((h,i)=>`<div class="card admin-card"><div class="row"><div><div class="label">Hotel ${i+1}</div><div class="big">${esc(h.name)}</div></div>${state.hotels.length>1?`<button class="btn danger small" data-delhotel="${i}">Remove</button>`:''}</div><div class="field"><label class="tiny">Hotel name</label><input data-hotel="${i}" data-hfield="name" value="${esc(h.name)}"></div><div class="field"><label class="tiny">Short description</label><input data-hotel="${i}" data-hfield="subtitle" value="${esc(h.subtitle)}"></div><div class="field"><label class="tiny">Map address</label><input data-hotel="${i}" data-hfield="address" value="${esc(h.address)}"></div></div>`).join('')+
   `<div class="btnrow"><button class="btn secondary" id="addHotel">Add hotel</button><button class="btn" id="saveHotels">Save hotel details</button></div>`;
   document.getElementById('saveHotels').onclick=async()=>{p.querySelectorAll('[data-hotel]').forEach(inp=>state.hotels[+inp.dataset.hotel][inp.dataset.hfield]=inp.value.trim());const r=await save();renderAll();showOrganizer('hotels');if(r.shared)alert('Hotel details saved online.')};
   document.getElementById('addHotel').onclick=async()=>{const id='hotel'+(Date.now().toString().slice(-6));state.hotels.push({id,name:'New hotel',subtitle:'Trip hotel',address:''});const r=await save();renderAll();showOrganizer('hotels');if(r.shared)alert('Hotel added.')};
   p.querySelectorAll('[data-delhotel]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.delhotel,removed=state.hotels[i];const fallback=state.hotels.find((_,x)=>x!==i);state.itinerary.forEach(d=>{if(d[2]===removed.id)d[2]=fallback.id});state.hotels.splice(i,1);const r=await save();renderAll();showOrganizer('hotels');if(r.shared)alert('Hotel removed. Any affected itinerary days were moved to another hotel base.')});
 }
 if(type==='people'){p.innerHTML=`<div class="card admin-card"><div class="label">Add traveller</div><div class="grid2"><div class="field"><label class="tiny">Name</label><input id="pName" placeholder="Traveller name"></div><div class="field"><label class="tiny">Email (optional)</label><input id="pEmail" placeholder="name@example.com"></div></div><button class="btn" id="addPerson">Add traveller</button></div><div class="card"><div class="label">Current travellers · ${state.travellers.length}</div>${state.travellers.map((t,i)=>`<div class="person"><div><b>${esc(t.name)}</b><div class="tiny">${t.email?esc(t.email):'No email'}</div></div><button class="btn danger small" data-delperson="${i}">Remove</button></div>`).join('')}</div>`;document.getElementById('addPerson').onclick=()=>{const name=pName.value.trim(),email=pEmail.value.trim();if(!name){alert('Add a traveller name.');return}state.travellers.push({name,email});save().then(()=>{renderAll();showOrganizer('people')})};p.querySelectorAll('[data-delperson]').forEach(b=>b.onclick=()=>{state.travellers.splice(+b.dataset.delperson,1);save().then(()=>{renderAll();showOrganizer('people')})})}

}
function setOrganizerNav(tab){
 document.querySelectorAll('[data-adminnav]').forEach(x=>x.classList.toggle('active',x.dataset.adminnav===tab));
}
function showOrganizer(tab){
 organizerMode=true;
 document.querySelector('.app').classList.add('organizer-active');
 document.getElementById('modeBtn').textContent=isAuthorizedOrganizer()?'Traveller mode':'Organizer sign in';
 navigate('organizer');renderOrganizer();
 if(isAuthorizedOrganizer())setTimeout(()=>{const t=[...document.querySelectorAll('.tab')].find(x=>x.dataset.admin===tab);if(t)t.click();else renderAdminPanel(tab);setOrganizerNav(tab)},0)
}
function navigate(page){if(page==='messages'){markAlertsRead();renderHome();renderMessages();}document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===page));updateAlertBadge();window.scrollTo(0,0)}
document.querySelectorAll('.traveller-bottom .nav').forEach(n=>n.addEventListener('click',()=>navigate(n.dataset.page)));
document.querySelectorAll('[data-adminnav]').forEach(n=>n.addEventListener('click',()=>showOrganizer(n.dataset.adminnav)));
if(organizerAccess){
 document.getElementById('modeBtn').classList.remove('hidden');
 document.getElementById('modeBtn').textContent='Organizer sign in';
 document.getElementById('modeBtn').onclick=()=>{if(organizerMode){organizerMode=false;document.querySelector('.app').classList.remove('organizer-active');document.getElementById('modeBtn').textContent=isAuthorizedOrganizer()?'Organizer mode':'Organizer sign in';navigate('home')}else showOrganizer('schedule')};
}

tripDoc.onSnapshot({includeMetadataChanges:true},async snap=>{
 firebaseReady=true; remoteDocExists=snap.exists;
 if(snap.exists){
   const remote=snap.data();
   try{
     const parsed=remote&&remote.payload?JSON.parse(remote.payload):null;
     if(parsed&&Array.isArray(parsed.itinerary)&&Array.isArray(parsed.hotels)){
       state=parsed;
       localStorage.setItem('pugliaTripState',JSON.stringify(state));
       renderAll();
       if(organizerMode)renderOrganizer();
       if(!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites){
         lastSyncTime=Date.now();
         setSyncStatus('Shared trip is up to date · '+formatSyncTime(),'ok');
       }else if(snap.metadata.fromCache){
         setSyncStatus('Showing saved data while reconnecting…');
       }
     }
   }catch(e){
     console.error('Could not read shared trip data',e);
     setSyncStatus('Shared data could not be read.','error');
   }
 }else if(isAuthorizedOrganizer()){
   await save();
 }else{
   setSyncStatus('Waiting for organizer to publish the shared trip…');
 }
},e=>{
 firebaseReady=true; syncError=e.message||String(e);
 console.error('Firestore listener failed',e);
 setSyncStatus('Could not connect to shared trip data.','error');
});
auth.onAuthStateChanged(async user=>{
 currentUser=user||null;
 if(organizerAccess)document.getElementById('modeBtn').textContent=isAuthorizedOrganizer()?(organizerMode?'Traveller mode':'Organizer mode'):'Organizer sign in';
 if(isAuthorizedOrganizer()&&firebaseReady&&!remoteDocExists){await save();}
 if(organizerMode)renderOrganizer();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;renderHome();});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;renderHome();});

renderAll();
</script>
</body></html>
