    ['Sept 13','Maglie','south','53 km','50 min','9:00 AM','5:00 PM',['Piazza Aldo Moro','Palazzo Baronale Capece','Archaeological Museum of Maglie','Dolmen Li Scusi']],
    ['Sept 14','Rest Day','south','','','—','—',[]],
    ['Sept 15','Otranto','south','47 km','1 hr','8:30 AM','5:30 PM',['Otranto Cathedral','Castello Aragonese','Old Town Streets','Lungomare Promenade','Cava di Bauxite']],
    ['Sept 16','Open / flexible day','south','47 km','1 hr','9:00 AM','5:00 PM',[]],
    ['Sept 17','Gallipoli','south','46 km','1 hr','8:30 AM','5:30 PM',['Centro Storico','Cathedral of Sant’Agata','Gallipoli Fish Market','City Walls','Underground Olive Oil Mills']],

    ['Sept 19','Locorotondo','north','125 km','1 hr 30 min','8:30 AM','5:30 PM',['Historic Center','Villa Comunale viewpoint','Church of San Giorgio','Via Nardelli']],
    ['Sept 20','Alberobello','north','125 km','1 hr 30 min','8:30 AM','5:30 PM',['Trullo Sovrano','Rione Monti','Aia Piccola','Belvedere Santa Lucia']],
    ['Sept 21','Monopoli & Polignano a Mare','north','100 km','1 hr 15 min','8:30 AM','6:00 PM',['Monopoli Porto Antico','Castello Carlo V','Lama Monachile Beach','Polignano Old Town terraces']],
    ['Sept 22','Matera','north','90 km','1 hr 15 min','8:00 AM','6:00 PM',['Sassi di Matera','Rock Churches','Casa Grotta di Vico Solitario','Belvedere di Murgia Timone','Palombaro Lungo']],
    ['Sept 23','Bari','north','60 km','1 hr','8:30 AM','5:30 PM',['Basilica di San Nicola','Bari Vecchia','Castello Normanno-Svevo','Lungomare Nazario Sauro','Strada delle Orecchiette']],
    ['Sept 24','Rest Day','north','','','—','—',[]],
    ['Sept 25','Altamura','north','60 km','1 hr','8:30 AM','5:30 PM',['Altamura Cathedral','Historic Center','Claustri courtyards','Altamura Man Museum']],
    ['Sept 26','Barletta & Trani','north','14 km','20 min','8:30 AM','5:30 PM',['Colossus of Barletta','Castello Svevo di Barletta','Trani Cathedral','Trani Harbor','Castello Svevo di Trani']],
    ['Sept 27','Departure for Naples','north','300 km','3 hr','7:30 AM','—',['Travel to Naples for flight home']]
  ]
};
let state=JSON.parse(localStorage.getItem('pugliaTripState')||'null')||structuredClone(defaultState);
let organizerMode=false;
const organizerAccess=new URLSearchParams(window.location.search).get('organizer')==='1';

const firebaseConfig={
 apiKey:"AIzaSyA-THZUMLlfymEjxSKX-DctOSfqqvwkUqk",
 authDomain:"travel-app-ee663.firebaseapp.com",
 projectId:"travel-app-ee663",
 storageBucket:"travel-app-ee663.firebasestorage.app",
 messagingSenderId:"390553674703",
 appId:"1:390553674703:web:072ef614cafc9121d728ba",
 measurementId:"G-XNFS8S5F06"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
const tripDoc=db.collection('tripData').doc('puglia2026');
const organizerUIDs=["qqJjUwiF4NRim1AAPuKykpxxhIj2","NsVy4dA8KMV485wQ1yTJd2F6wJq2"];
let currentUser=null;
let firebaseReady=false;
let remoteDocExists=false;
const isAuthorizedOrganizer=()=>!!currentUser&&organizerUIDs.includes(currentUser.uid);

function save(){
 localStorage.setItem('pugliaTripState',JSON.stringify(state));
 if(firebaseReady&&isAuthorizedOrganizer()){
   tripDoc.set(JSON.parse(JSON.stringify(state))).catch(err=>{
     console.error(err);
     alert('Saved on this device, but the online update failed. Check the organizer sign-in and internet connection.');
   });
 }
}
const alertKey=n=>n?`${n.date||''}|${n.title||''}|${n.body||''}`:'';
if(localStorage.getItem('pugliaLastReadAlertKey')===null){localStorage.setItem('pugliaLastReadAlertKey',alertKey(state.notifications[0]));}
function unreadAlertCount(){
 const last=localStorage.getItem('pugliaLastReadAlertKey')||'';
 if(!state.notifications.length)return 0;
 const idx=state.notifications.findIndex(n=>alertKey(n)===last);
 return idx<0?state.notifications.length:idx;
}
function markAlertsRead(){localStorage.setItem('pugliaLastReadAlertKey',alertKey(state.notifications[0]));updateAlertBadge();}
function updateAlertBadge(){
 const nav=document.getElementById('alertsNav'); if(!nav)return;
 nav.querySelectorAll('.alert-badge').forEach(x=>x.remove());
 const count=unreadAlertCount();
 if(count){const b=document.createElement('span');b.className='alert-badge';b.textContent=count>9?'9+':count;nav.appendChild(b);}
}

const hotelById=id=>state.hotels.find(h=>h.id===id)||state.hotels[0];
const esc=s=>(s??'').toString().replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const generatedRoute=(d,h)=>`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(h.address)}&destination=${encodeURIComponent(d[1]+' Italy')}`;
const routeFor=(d,h)=>/^https?:\/\//i.test((d[8]||'').trim())?d[8].trim():generatedRoute(d,h);
function renderAll(){renderHome();renderItinerary();renderMessages();renderMore();renderOrganizer();updateAlertBadge()}
function itineraryDate(d){
 const m=(d[0]||'').match(/([A-Za-z]+)\s+(\d{1,2})/); if(!m)return null;
 const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sept:8,Sep:8,Oct:9,Nov:10,Dec:11};
 const key=m[1].slice(0,4); const month=months[key]??months[m[1].slice(0,3)];
 return month===undefined?null:new Date(2026,month,+m[2]);
}
function homeDayForToday(){
 const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const dated=state.itinerary.map((d,i)=>({d,i,date:itineraryDate(d)})).filter(x=>x.date).sort((a,b)=>a.date-b.date);
 if(!dated.length)return {d:state.itinerary[0],label:'Next up'};
 const first=dated[0],last=dated[dated.length-1];
 const exact=dated.find(x=>x.date.getTime()===today.getTime());
 if(exact)return {d:exact.d,i:exact.i,date:exact.date,label:`Today · ${exact.d[0]}`,today:true};
 if(today<first.date)return {d:first.d,i:first.i,date:first.date,label:`Next up · ${first.d[0]}`,beforeTrip:true};
 if(today>last.date)return {d:last.d,i:last.i,date:last.date,label:'Trip complete',complete:true};
 const next=dated.find(x=>x.date>today);
 return next?{d:next.d,i:next.i,date:next.date,label:`Next up · ${next.d[0]}`}:{d:last.d,i:last.i,date:last.date,label:'Trip complete',complete:true};
}
function secondaryHomeDay(pick){
 if(pick.complete)return null;
 const dated=state.itinerary.map((d,i)=>({d,i,date:itineraryDate(d)})).filter(x=>x.date).sort((a,b)=>a.date-b.date);
 if(pick.today){
   const tomorrow=new Date(pick.date); tomorrow.setDate(tomorrow.getDate()+1);
   const exactTomorrow=dated.find(x=>x.date.getTime()===tomorrow.getTime());
   return exactTomorrow?{...exactTomorrow,label:`Tomorrow · ${exactTomorrow.d[0]}`}:null;
 }
 if(pick.beforeTrip){
   const following=dated.find(x=>x.date>pick.date);
   return following?{...following,label:`Following day · ${following.d[0]}`}:null;
 }
 return null;
}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true}
function installCard(){
  if(isStandalone()) return '';
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(deferredInstallPrompt) return `<div class="card install-card"><div class="label">Install app</div><div class="big">Add Puglia 2026 to your phone</div><div class="muted">Install it for a full-screen app experience and quicker access.</div><button class="btn" id="installAppBtn">Install Puglia 2026</button></div>`;
  if(ios) return `<div class="card install-card"><div class="label">Add to iPhone</div><div class="big">Install Puglia 2026</div><div class="muted">In Safari, tap Share, then choose <b>Add to Home Screen</b>.</div></div>`;
  return '';
}
function renderHome(){
 const pick=homeDayForToday(),d=pick.d,h=hotelById(d[2]),latest=state.notifications[0],secondary=secondaryHomeDay(pick);
 const secondaryHtml=secondary?(()=>{const sd=secondary.d,sh=hotelById(sd[2]);return `<div class="card"><div class="label">${esc(secondary.label)}</div><div class="row"><div><div class="big">${esc(sd[1])}</div><div class="muted">${esc(sh.name)}</div></div><span class="pill">Coming up</span></div><div class="schedule"><div class="timebox"><span class="tiny">Morning departure</span><b>${esc(sd[5])}</b></div><div class="timebox"><span class="tiny">PM return</span><b>${esc(sd[6])}</b></div></div>${sd[3]||sd[8]?`<div class="btnrow"><a class="btn secondary" target="_blank" rel="noopener" href="${esc(routeFor(sd,sh))}">Quick route</a></div>`:''}</div>`})():'';
 document.getElementById('home').innerHTML=installCard()+`
 ${latest?`<div class="card notice"><div class="label">Latest organizer notification${unreadAlertCount()?`<span class="home-alert-badge">${unreadAlertCount()>9?'9+':unreadAlertCount()} new</span>`:''}</div><div class="big">${esc(latest.title)}</div><div class="muted">${esc(latest.body)}</div><div class="btnrow"><button class="btn secondary small" onclick="navigate('messages')">View alerts</button></div></div>`:''}
 <div class="card hotel"><div class="label">${pick.complete?'Final hotel':'Hotel for this day'}</div><div class="big">${esc(h.name)}</div><div class="muted">${esc(h.subtitle)}</div></div>
 <div class="card"><div class="label">${esc(pick.label)}</div><div class="big">${esc(d[1])}</div><div class="muted">${pick.complete?'Your Puglia itinerary has finished.':`${esc(d[3])}${d[4]?` · about ${esc(d[4])} from the hotel`:''}`}</div>
 ${pick.complete?'':`<div class="schedule"><div class="timebox"><span class="tiny">Morning departure</span><b>${esc(d[5])}</b></div><div class="timebox"><span class="tiny">PM return</span><b>${esc(d[6])}</b></div></div>`}
 ${!pick.complete&&(d[3]||d[8])?`<div class="btnrow"><a class="btn" target="_blank" rel="noopener" href="${esc(routeFor(d,h))}">Open route map</a></div>`:''}</div>
 ${secondaryHtml}
 <div class="card whatsapp"><div class="label">Group communication</div><div class="big">WhatsApp group</div><div class="muted">Use WhatsApp for general trip communication. Organizer alerts will still appear here in the app.</div><div class="btnrow">${state.whatsapp?`<a class="btn secondary" target="_blank" href="${esc(state.whatsapp)}">Open WhatsApp group</a>`:`<button class="btn secondary" onclick="alert('The organizer has not added the WhatsApp group link yet.')">WhatsApp info</button>`}</div></div>`;
const installBtn=document.getElementById('installAppBtn');if(installBtn)installBtn.onclick=async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;renderHome()};
}
function renderItinerary(){const days=document.getElementById('days');days.innerHTML='';state.itinerary.forEach((d,i)=>{const h=hotelById(d[2]),div=document.createElement('div');div.className='card day';div.innerHTML=`<div class="day-head"><div><div class="label">${d[0]}</div><div class="day-title">${esc(d[1])}</div>${d[3]||d[4]?`<div class="distance">${esc(d[3])}${d[3]&&d[4]?' · ':''}${esc(d[4])}${(d[3]||d[4])?` from ${esc(h.name)}`:''}</div>`:''}</div><div class="chev">›</div></div><div class="details"><div class="schedule"><div class="timebox"><span class="tiny">Morning departure</span><b>${esc(d[5])}</b></div><div class="timebox"><span class="tiny">PM return</span><b>${esc(d[6])}</b></div></div>${Array.isArray(d[7])&&d[7].length?`<div class="label" style="margin-top:14px">Things to see</div><ul class="list">${d[7].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${d[3]||d[8]?`<a class="btn" target="_blank" rel="noopener" href="${esc(routeFor(d,h))}">Route from hotel</a>`:''}</div>`;div.addEventListener('click',e=>{if(e.target.tagName!=='A')div.classList.toggle('open')});days.appendChild(div)})}
function renderMessages(){document.getElementById('messageList').innerHTML=state.notifications.length?state.notifications.map((n,i)=>`<div class="card ${i===0?'notice':''}"><div class="label">Organizer · ${esc(n.date)}</div><div class="big">${esc(n.title)}</div><div class="muted">${esc(n.body)}</div></div>`).join(''):`<div class="card empty">No organizer notifications yet.</div>`}
function renderTravellers(){document.getElementById('travellerSummary').innerHTML=`<div class="card"><div class="row"><div><div class="big" style="margin:0">${state.travellers.length} travellers</div><div class="muted">Name and optional email only</div></div><span class="pill">Group</span></div></div>`;document.getElementById('travellerList').innerHTML=state.travellers.map(t=>`<div class="person"><div><b>${esc(t.name)}</b><div class="tiny">${t.email?esc(t.email):'email optional / not added'}</div></div></div>`).join('')}

function renderMore(){
 const el=document.getElementById('moreContent'); if(!el)return;
 const hotelCards=state.hotels.map(h=>`<div class="card hotel"><div class="label">${esc(h.subtitle||'Hotel')}</div><div class="big">${esc(h.name)}</div><div class="muted">${esc(h.address)}</div><div class="btnrow"><a class="btn secondary" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.address||h.name)}">Open map</a></div></div>`).join('');
 const wa=state.whatsapp
   ? `<a class="btn" target="_blank" rel="noopener" href="${esc(state.whatsapp)}">Open WhatsApp group</a>`
   : `<div class="muted">The organizer has not added the WhatsApp group link yet.</div>`;
 const installHelp=isStandalone()
   ? `<div class="muted">Puglia 2026 is installed on this phone.</div>`
   : (/iphone|ipad|ipod/i.test(navigator.userAgent)
      ? `<div class="muted">On iPhone: open this site in Safari, tap <b>Share</b>, then <b>Add to Home Screen</b>.</div>`
      : `<div class="muted">Use your browser's Install or Add to Home Screen option to keep Puglia 2026 on your phone.</div>`);
 el.innerHTML=`
   <div class="card"><div class="label">Hotel information</div><div class="big">Where we are staying</div><div class="muted">Tap a hotel to open its location in Google Maps.</div></div>
   ${hotelCards}
   <div class="card whatsapp"><div class="label">Group communication</div><div class="big">WhatsApp</div><div class="muted">Use the group for general trip communication. Important organizer changes will also appear under Alerts.</div><div class="btnrow">${wa}</div></div>
   <div class="card"><div class="label">App help</div><div class="big">Using Puglia 2026</div>${installHelp}<div class="muted" style="margin-top:10px">If a schedule changes, check <b>Alerts</b> and the updated itinerary.</div></div>`;
}

function renderOrganizer(){
 const el=document.getElementById('organizerContent');
 if(!organizerAccess){el.innerHTML='<div class="card empty">Organizer access is not available from the traveller link.</div>';return;}
 if(!isAuthorizedOrganizer()){
   el.innerHTML=`<div class="card auth-card"><div class="label">Organizer sign in</div><div class="big">Manage Puglia 2026</div>
   <div class="field"><label class="tiny">Email</label><input id="orgEmail" type="email" autocomplete="username" placeholder="Organizer email"></div>
   <div class="field"><label class="tiny">Password</label><input id="orgPassword" type="password" autocomplete="current-password" placeholder="Password"></div>
   <div class="btnrow"><button class="btn" id="emailSignIn">Sign in</button><button class="btn secondary" id="googleSignIn">Sign in with Google</button>${currentUser?'<button class="btn secondary" id="signOutBtn">Sign out</button>':''}</div>
   <div class="auth-status ${currentUser?'error':''}">${currentUser?'This signed-in account is not authorized as an organizer.':'Sign in with an organizer account to edit and publish trip information.'}</div></div>`;
   document.getElementById('emailSignIn').onclick=async()=>{const email=orgEmail.value.trim(),password=orgPassword.value;if(!email||!password){alert('Enter the organizer email and password.');return}try{await auth.signInWithEmailAndPassword(email,password)}catch(e){alert('Sign-in failed. Please check the email and password.')}};
   document.getElementById('googleSignIn').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){alert('Google sign-in did not complete.')}};
   const so=document.getElementById('signOutBtn');if(so)so.onclick=()=>auth.signOut();return;
 }
 el.innerHTML=`<div class="card success"><div class="row"><div><div class="label">Organizer connected</div><div class="big" style="margin:3px 0">${esc(currentUser.email||'Authorized organizer')}</div><div class="muted">Changes are shared online with travellers.</div></div><button class="btn secondary small" id="signOutTop">Sign out</button></div></div><div class="tabs"><button class="tab active" data-admin="schedule">Daily schedule</button><button class="tab" data-admin="alerts">Alerts</button><button class="tab" data-admin="hotels">Hotels</button><button class="tab" data-admin="people">Travellers</button><button class="tab" data-admin="whatsapp">WhatsApp</button></div><div id="adminPanel"></div>`;
 document.getElementById('signOutTop').onclick=()=>auth.signOut();
 el.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{el.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');renderAdminPanel(t.dataset.admin);setOrganizerNav(t.dataset.admin)});renderAdminPanel('schedule')
}
function renderAdminPanel(type){const p=document.getElementById('adminPanel'); if(!p)return;
 if(type==='schedule'){p.innerHTML=`<div class="card admin-card"><div class="label">Edit full itinerary</div><div class="muted">Edit any day below. Sights should be entered one per line. Leave the route link blank to have the app create a Google Maps route automatically from the selected hotel.</div>${state.itinerary.map((d,i)=>`<div class="editday"><div class="row"><div><b>${d[0]} · ${esc(d[1])}</b><div class="tiny">${esc(hotelById(d[2]).name)}</div></div><span class="admin-badge">Edit</span></div><div class="field"><label class="tiny">Destination</label><input data-day="${i}" data-field="1" value="${esc(d[1])}"></div><div class="field"><label class="tiny">Hotel base</label><select data-day="${i}" data-field="2">${state.hotels.map(h=>`<option value="${esc(h.id)}" ${h.id===d[2]?'selected':''}>${esc(h.name)}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label class="tiny">Distance from hotel</label><input data-day="${i}" data-field="3" value="${esc(d[3])}" placeholder="e.g. 80 km"></div><div class="field"><label class="tiny">Travel time</label><input data-day="${i}" data-field="4" value="${esc(d[4])}" placeholder="e.g. 1 hr 15 min"></div></div><div class="grid2"><div class="field"><label class="tiny">Morning departure</label><input data-day="${i}" data-field="5" value="${esc(d[5])}"></div><div class="field"><label class="tiny">PM return</label><input data-day="${i}" data-field="6" value="${esc(d[6])}"></div></div><div class="field"><label class="tiny">Things to see — one per line</label><textarea data-day="${i}" data-field="7">${esc((d[7]||[]).join('\n'))}</textarea></div><div class="field"><label class="tiny">Route link (optional)</label><input data-day="${i}" data-field="8" value="${esc(d[8]||'')}" placeholder="https://www.google.com/maps/..."></div></div>`).join('')}<div class="btnrow"><button class="btn" id="saveSchedule">Save itinerary changes</button></div></div>`;document.getElementById('saveSchedule').onclick=()=>{p.querySelectorAll('[data-day]').forEach(inp=>{const d=state.itinerary[+inp.dataset.day],f=+inp.dataset.field;if(f===7)d[f]=inp.value.split(/\n/).map(x=>x.trim()).filter(Boolean);else if(f===8)d[f]=/^https?:\/\//i.test(inp.value.trim())?inp.value.trim():'';else if(f===5||f===6)d[f]=inp.value.trim()||'—';else d[f]=inp.value.trim();});save();renderAll();showOrganizer('schedule');alert('Itinerary changes saved.')};}
 if(type==='alerts'){p.innerHTML=`<div class="card admin-card"><div class="label">Send organizer alert</div><div class="field"><label class="tiny">Date / label</label><input id="aDate" placeholder="e.g. Sept 10"></div><div class="field"><label class="tiny">Title</label><input id="aTitle" placeholder="e.g. Departure time changed"></div><div class="field"><label class="tiny">Message</label><textarea id="aBody" placeholder="Write the message travellers should see"></textarea></div><button class="btn" id="sendAlert">Publish alert</button></div><div class="card"><div class="label">Existing alerts</div>${state.notifications.map((n,i)=>`<div class="editday"><b>${esc(n.title)}</b><div class="tiny">${esc(n.date)}</div><div class="muted">${esc(n.body)}</div><div class="btnrow"><button class="btn danger small" data-delalert="${i}">Delete</button></div></div>`).join('')}</div>`;document.getElementById('sendAlert').onclick=()=>{const date=aDate.value.trim(),title=aTitle.value.trim(),body=aBody.value.trim();if(!title||!body){alert('Add a title and message.');return}state.notifications.unshift({date:date||'Organizer',title,body});save();renderAll();showOrganizer('alerts')};p.querySelectorAll('[data-delalert]').forEach(b=>b.onclick=()=>{state.notifications.splice(+b.dataset.delalert,1);save();renderAll();showOrganizer('alerts')})}
 if(type==='hotels'){p.innerHTML=state.hotels.map((h,i)=>`<div class="card admin-card"><div class="label">${i===0?'Southern':'Northern'} hotel</div><div class="field"><label class="tiny">Hotel name</label><input data-hotel="${i}" data-hfield="name" value="${esc(h.name)}"></div><div class="field"><label class="tiny">Short description</label><input data-hotel="${i}" data-hfield="subtitle" value="${esc(h.subtitle)}"></div><div class="field"><label class="tiny">Map address</label><input data-hotel="${i}" data-hfield="address" value="${esc(h.address)}"></div></div>`).join('')+`<button class="btn" id="saveHotels">Save hotel details</button>`;document.getElementById('saveHotels').onclick=()=>{p.querySelectorAll('[data-hotel]').forEach(inp=>state.hotels[+inp.dataset.hotel][inp.dataset.hfield]=inp.value.trim());save();renderAll();showOrganizer('hotels');alert('Hotel details saved.')};}
 if(type==='people'){p.innerHTML=`<div class="card admin-card"><div class="label">Add traveller</div><div class="grid2"><div class="field"><label class="tiny">Name</label><input id="pName" placeholder="Traveller name"></div><div class="field"><label class="tiny">Email (optional)</label><input id="pEmail" placeholder="name@example.com"></div></div><button class="btn" id="addPerson">Add traveller</button></div><div class="card"><div class="label">Current travellers · ${state.travellers.length}</div>${state.travellers.map((t,i)=>`<div class="person"><div><b>${esc(t.name)}</b><div class="tiny">${t.email?esc(t.email):'No email'}</div></div><button class="btn danger small" data-delperson="${i}">Remove</button></div>`).join('')}</div>`;document.getElementById('addPerson').onclick=()=>{const name=pName.value.trim(),email=pEmail.value.trim();if(!name){alert('Add a traveller name.');return}state.travellers.push({name,email});save();renderAll();showOrganizer('people')};p.querySelectorAll('[data-delperson]').forEach(b=>b.onclick=()=>{state.travellers.splice(+b.dataset.delperson,1);save();renderAll();showOrganizer('people')})}
 if(type==='whatsapp'){p.innerHTML=`<div class="card admin-card"><div class="label">WhatsApp group</div><div class="muted">Paste the invitation link for the group. Travellers will then see an Open WhatsApp Group button on Home.</div><div class="field"><label class="tiny">WhatsApp invitation link</label><input id="waLink" value="${esc(state.whatsapp)}" placeholder="https://chat.whatsapp.com/..."></div><div class="btnrow"><button class="btn" id="saveWa">Save WhatsApp link</button>${state.whatsapp?'<button class="btn secondary" id="clearWa">Remove link</button>':''}</div></div>`;document.getElementById('saveWa').onclick=()=>{state.whatsapp=waLink.value.trim();save();renderAll();showOrganizer('whatsapp');alert('WhatsApp information saved.')};if(document.getElementById('clearWa'))document.getElementById('clearWa').onclick=()=>{state.whatsapp='';save();renderAll();showOrganizer('whatsapp')};}
}
function setOrganizerNav(tab){
 document.querySelectorAll('[data-adminnav]').forEach(x=>x.classList.toggle('active',x.dataset.adminnav===tab));
}
function showOrganizer(tab){
 organizerMode=true;
 document.querySelector('.app').classList.add('organizer-active');
 document.getElementById('modeBtn').textContent=isAuthorizedOrganizer()?'Traveller mode':'Organizer sign in';
 navigate('organizer');renderOrganizer();
 if(isAuthorizedOrganizer())setTimeout(()=>{const t=[...document.querySelectorAll('.tab')].find(x=>x.dataset.admin===tab);if(t)t.click();else renderAdminPanel(tab);setOrganizerNav(tab)},0)
}
function navigate(page){if(page==='messages'){markAlertsRead();renderHome();renderMessages();}document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===page));updateAlertBadge();window.scrollTo(0,0)}
document.querySelectorAll('.traveller-bottom .nav').forEach(n=>n.addEventListener('click',()=>navigate(n.dataset.page)));
document.querySelectorAll('[data-adminnav]').forEach(n=>n.addEventListener('click',()=>showOrganizer(n.dataset.adminnav)));
if(organizerAccess){
 document.getElementById('modeBtn').classList.remove('hidden');
 document.getElementById('modeBtn').textContent='Organizer sign in';
 document.getElementById('modeBtn').onclick=()=>{if(organizerMode){organizerMode=false;document.querySelector('.app').classList.remove('organizer-active');document.getElementById('modeBtn').textContent=isAuthorizedOrganizer()?'Organizer mode':'Organizer sign in';navigate('home')}else showOrganizer('schedule')};
}

tripDoc.onSnapshot(async snap=>{
 firebaseReady=true;remoteDocExists=snap.exists;
 if(snap.exists){
   const remote=snap.data();
   if(remote&&Array.isArray(remote.itinerary)&&Array.isArray(remote.hotels)){state=remote;localStorage.setItem('pugliaTripState',JSON.stringify(state));renderAll();if(organizerMode)renderOrganizer();}
 }else if(isAuthorizedOrganizer()){
   try{await tripDoc.set(JSON.parse(JSON.stringify(state)));remoteDocExists=true}catch(e){console.error(e)}
 }
},e=>{firebaseReady=true;console.error(e)});

auth.onAuthStateChanged(async user=>{
 currentUser=user||null;
 if(organizerAccess)document.getElementById('modeBtn').textContent=isAuthorizedOrganizer()?(organizerMode?'Traveller mode':'Organizer mode'):'Organizer sign in';
 if(isAuthorizedOrganizer()&&firebaseReady&&!remoteDocExists){try{await tripDoc.set(JSON.parse(JSON.stringify(state)));remoteDocExists=true}catch(e){console.error(e)}}
 if(organizerMode)renderOrganizer();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;renderHome();});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;renderHome();});

renderAll();
</script>
</body></html>
